name: build-windows

# Builds the Windows release from this repository with the runner's native MSVC toolchain: the four
# programs (Rust), the browser extensions (Chromium, Firefox, Safari and the signed CRX), and the
# Inno Setup installer with the portable/x64 ZIPs. The artifacts in target/dist are the inputs of the
# signing step (SignPath, once the project is accepted: set SIGNPATH_API_TOKEN and uncomment the last
# step).
#
# The same commands are in WORKPC-SETUP.md; this workflow is what makes a release a *verifiable*
# build of the source (a SignPath requirement: the binary must be the output of an automated build
# of the repository).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, MSVC)
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Python (the extension packer signs the CRX)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The CRX signing dependency
        run: python -m pip install --upgrade cryptography

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the four programs
        run: cargo build --release --no-default-features -p mdm-app -p mdm-nmhost -p mdm-cli -p mdm-mcp

      - name: Browser extensions (Chromium, Firefox, Safari + the signed CRX)
        # The secret holds the key's content; pack.ps1 wants a path, so write it to a temp file.
        env:
          EXTENSION_KEY_PEM: ${{ secrets.EXTENSION_SIGNING_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP "extension-key.pem"
          [System.IO.File]::WriteAllText($key, $env:EXTENSION_KEY_PEM)
          $env:MDM_EXTENSION_KEY = $key
          powershell -ExecutionPolicy Bypass -File tools/extension/pack.ps1

      - name: Installer and ZIPs into target/dist
        run: powershell -ExecutionPolicy Bypass -File tools/installer/build.ps1 -NoBuild

      - name: Upload the unsigned artifacts (input of the signing step)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: target/dist/*

      # ---- Signing (after the project is accepted by SignPath Foundation) ------------------
      # 1. Create a SignPath project linked to this repository, a signing policy `release-signing`
      #    with a manual approval, and an artifact configuration matching these files.
      # 2. Add the secret SIGNPATH_API_TOKEN and the variables SIGNPATH_ORG_ID.
      # 3. Uncomment this step.
      #
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORG_ID }}
      #     project-slug: matt-download-manager
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed
